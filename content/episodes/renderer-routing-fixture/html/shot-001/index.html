<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Browser renderer fixture</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    html, body { margin: 0; width: 1280px; height: 720px; background: #0d1320; color: #f4f7fb; font-family: Arial, sans-serif; }
    [data-composition-id] { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .content { width: 100%; height: 100%; box-sizing: border-box; padding: 110px 140px; display: flex; flex-direction: column; justify-content: center; gap: 30px; }
    .eyebrow { color: #6de0c8; font-size: 22px; letter-spacing: .16em; }
    h1 { margin: 0; font-size: 88px; line-height: .95; max-width: 900px; }
    .accent { color: #ffb86b; }
    .diagram { width: 860px; height: 190px; }
    .bar { transform-origin: left center; }
  </style>
</head>
<body>
  <main data-composition-id="browser-renderer-fixture" data-width="1280" data-height="720" data-duration="4">
    <div class="content">
      <div id="eyebrow" class="eyebrow clip" data-start="0" data-duration="4" data-track-index="1">BROWSER SHOT / SVG</div>
      <h1 id="title" class="clip" data-start="0" data-duration="4" data-track-index="2">Visuals are authored in <span class="accent">HTML</span>.</h1>
      <svg class="diagram" viewBox="0 0 860 190" role="img" aria-label="SVG bar diagram">
        <rect x="0" y="30" width="860" height="34" rx="17" fill="#263449" />
        <rect id="bar" class="bar" x="0" y="30" width="640" height="34" rx="17" fill="#6de0c8" />
        <circle id="dot" cx="640" cy="47" r="18" fill="#ffb86b" />
        <text x="0" y="130" fill="#b5c1d4" font-size="26">SVG + CSS + JavaScript + GSAP</text>
      </svg>
    </div>
  </main>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({paused: true});
    tl.from('#eyebrow', {y: 24, opacity: 0, duration: .45, ease: 'power3.out'}, .15)
      .from('#title', {y: 36, opacity: 0, duration: .7, ease: 'expo.out'}, .3)
      .from('#bar', {scaleX: 0, duration: 1, ease: 'power4.out'}, .75)
      .from('#dot', {scale: 0, transformOrigin: 'center', duration: .45, ease: 'back.out(1.7)'}, 1.15);
    window.__timelines['browser-renderer-fixture'] = tl;
  </script>
</body>
</html>
